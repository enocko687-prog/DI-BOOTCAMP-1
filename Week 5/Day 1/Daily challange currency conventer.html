<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="daily challange currency conventer.css">
</head>
<body>
  <main class="converter-shell">
    <header>
      <p class="eyebrow">Currency desk / live rates</p>
      <h1>Move money<br><em>clearly.</em></h1>
      <p class="intro">Choose two currencies, enter an amount, and get the current conversion in seconds.</p>
    </header>

    <section class="converter-panel">
      <form id="converter-form">
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0" step="any" value="100" required>
        <div class="currency-row">
          <div>
            <label for="from-currency">From</label>
            <select id="from-currency" required></select>
          </div>
          <button id="swap-currencies" class="swap-button" type="button" aria-label="Swap currencies" title="Swap currencies">↕</button>
          <div>
            <label for="to-currency">To</label>
            <select id="to-currency" required></select>
          </div>
        </div>
        <button class="convert-button" type="submit">Convert amount <span>→</span></button>
      </form>
      <div id="result" class="result" role="status" aria-live="polite">Loading currencies...</div>
      <p id="rate" class="rate"></p>
    </section>

    <footer><span>Rates supplied by ExchangeRate-API</span><span>Updated on request</span></footer>
  </main>
  <script src="Daily challange currency conventer.js"></script>
</body>
</html>
