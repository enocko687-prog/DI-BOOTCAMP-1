<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Currency Converter</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="converter-app">
		<header>
			<p class="eyebrow">Live exchange rates</p>
			<h1>Currency<br><span>converter</span></h1>
			<p class="intro">Know exactly what your money is worth wherever you go.</p>
		</header>

		<section class="converter-card" aria-label="Currency converter">
			<form id="converter-form">
				<label for="amount">Amount</label>
				<input id="amount" name="amount" type="number" min="0" step="any" value="1" required>

				<div class="currency-row">
					<div class="currency-field">
						<label for="from-currency">From</label>
						<select id="from-currency" name="from-currency" required disabled>
							<option>Loading currencies...</option>
						</select>
					</div>

					<button id="swap-button" class="swap-button" type="button" aria-label="Swap currencies" title="Swap currencies">&#8646;</button>

					<div class="currency-field">
						<label for="to-currency">To</label>
						<select id="to-currency" name="to-currency" required disabled>
							<option>Loading currencies...</option>
						</select>
					</div>
				</div>

				<button id="convert-button" class="convert-button" type="submit" disabled>Convert</button>
			</form>

			<div id="loading" class="loading is-hidden" role="status">Getting the latest rate<span class="dots">...</span></div>
			<div id="error" class="error is-hidden" role="alert"></div>
			<div id="result" class="result is-hidden" aria-live="polite">
				<p id="rate-text"></p>
				<strong id="converted-amount"></strong>
				<p id="updated-text" class="updated-text"></p>
			</div>
		</section>

		<details class="advanced-settings">
			<summary>Use a personal ExchangeRate-API key</summary>
			<label for="api-key">API key <span>(optional)</span></label>
			<input id="api-key" type="password" autocomplete="off" placeholder="Paste your key here">
			<button id="save-key" type="button">Save key</button>
			<p>Without a key, the app uses the provider's open endpoint. A personal key enables the documented conversion endpoints.</p>
		</details>
	</main>
	<script src="script.js"></script>
</body>
</html>
