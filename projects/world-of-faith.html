<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Faith | Project Preview</title>
  <style>
    :root { --navy: #082943; --cream: #f4f7f8; --gold: #d8a73e; --muted: #b8cbd0; }
    * { box-sizing: border-box; }
    body { margin: 0; color: white; background: var(--navy); font: 1rem/1.6 Arial, sans-serif; }
    main { min-height: 100vh; padding: 2rem 7%; background: radial-gradient(circle at 85% 15%, #1d5b68, transparent 35%), var(--navy); }
    .back { color: white; font-size: .85rem; font-weight: 700; text-decoration: none; }
    .hero { max-width: 850px; padding: 15vh 0 8rem; }
    .eyebrow { color: var(--gold); font-size: .8rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 1rem 0; color: var(--gold); font: 700 clamp(3.5rem, 9vw, 7rem)/.95 Georgia, serif; }
    p { max-width: 600px; color: var(--muted); font-size: 1.2rem; }
    .pillars { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
    .pillars span { border: 1px solid #5c7c82; padding: .7rem 1rem; }
    .cta { display: inline-block; margin-top: 2rem; padding: .9rem 1.2rem; color: var(--navy); background: var(--gold); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">&larr; Back to portfolio</a>
    <section class="hero">
      <p class="eyebrow">Project preview / Faith and connection</p>
      <h1>Faith that brings people together.</h1>
      <p>A welcoming digital platform concept for sharing encouragement, teaching, prayer, and community stories.</p>
      <div class="pillars"><span>Daily encouragement</span><span>Community stories</span><span>Prayer and connection</span></div>
      <a class="cta" href="../index.html#contact">Start a faith project</a>
    </section>
  </main>
</body>
</html>
