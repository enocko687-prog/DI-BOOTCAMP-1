<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Crumb Bakery | Project Preview</title>
  <style>
    :root { --brown: #3f2419; --cream: #fff8ed; --gold: #d88b35; --pink: #f4cfc0; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--brown); background: var(--cream); font: 1rem/1.6 Georgia, serif; }
    main { min-height: 100vh; padding: 2rem 7%; display: grid; align-items: center; }
    .back { color: var(--brown); font: 700 .85rem Arial, sans-serif; text-decoration: none; }
    .hero { max-width: 900px; padding: 7rem 0; }
    .eyebrow { color: var(--gold); font: 700 .8rem Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 700px; margin: 1rem 0; font-size: clamp(3.5rem, 9vw, 7rem); line-height: .95; }
    p { max-width: 560px; font-size: 1.2rem; }
    .menu { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
    .menu span { background: var(--pink); padding: .7rem 1rem; }
    .cta { display: inline-block; margin-top: 2rem; padding: .9rem 1.2rem; color: white; background: var(--brown); font: 700 .9rem Arial, sans-serif; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">&larr; Back to portfolio</a>
    <section class="hero">
      <p class="eyebrow">Project preview / Food and hospitality</p>
      <h1>Fresh from the oven.</h1>
      <p>A warm bakery website concept designed to make every loaf, pastry, and celebration feel personal.</p>
      <div class="menu"><span>Sourdough</span><span>Celebration cakes</span><span>Morning pastries</span></div>
      <a class="cta" href="../index.html#contact">Start a bakery project</a>
    </section>
  </main>
</body>
</html>
