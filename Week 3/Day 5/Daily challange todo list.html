<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="Daily%20challange%20todo%20list.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="todo-app">
        <h1>Todo List</h1>
        <form id="taskForm">
            <input id="taskInput" type="text" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit">Submit</button>
        </form>
        <div class="listTasks"></div>
    </main>

    <script src="Daily%20challange%20todo%20list.js"></script>
</body>
</html>
